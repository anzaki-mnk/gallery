<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>餡咲市 フォトギャラリー投稿</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>餡咲市 フォトギャラリー投稿</h1>
    <p class="subtitle">あなたが撮影した餡咲市の魅力を投稿しよう！</p>

    <!-- ① 未ログイン時に表示されるエリア -->
    <div id="logged-out-view" class="card">
      <p>写真を投稿するには Discord アカウントでログインしてください。</p>
      <button id="login-btn" class="btn btn-discord">
        <svg width="20" height="20" viewBox="0 0 127.14 96.36" fill="currentColor">
          <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1,105.25,105.25,0,0,0,32.19-16.14c2.64-27.38-4.51-51.11-18.92-72.15ZM42.45,65.69C36.18,65.69,31,60,31,53C31,46.12,36,40.41,42.45,40.41C48.9,40.41,54,46.12,53.88,53S48.9,65.69,42.45,65.69Zm42.24,0C78.42,65.69,73.25,60,73.25,53s5.08-12.63,11.44-12.63C91.1,40.41,96.18,46.12,96.06,53S91.1,65.69,84.69,65.69Z"/>
        </svg>
        Discordでログイン
      </button>
    </div>

    <!-- ② ログイン完了時に表示されるエリア -->
    <div id="logged-in-view" class="card hidden">
      <div class="user-profile">
        <span id="user-display-name">ユーザー名</span> さんでログイン中
        <button id="logout-btn" class="btn-text">ログアウト</button>
      </div>

      <form id="upload-form">
        <div class="form-group">
          <label for="photo-title">写真のタイトル *</label>
          <input type="text" id="photo-title" placeholder="例：桜咲く餡咲公園" required>
        </div>

        <div class="form-group">
          <label for="photo-file">画像ファイルを選んでください *</label>
          <input type="file" id="photo-file" accept="image/*" required>
        </div>

        <!-- プレビュー表示用 -->
        <div id="image-preview" class="preview-box hidden">
          <img id="preview-img" src="" alt="プレビュー">
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary">
          投稿する
        </button>
      </form>

      <!-- 進捗メッセージ -->
      <p id="status-message" class="status-message"></p>
    </div>
  </div>

  <!-- Firebase JavaScript (ES Modules) -->
  <script type="module" src="app.js"></script>
</body>
</html>
