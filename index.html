<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>餡咲市 写真投稿</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container">

    <header class="header">
      <h1>餡咲市 写真投稿</h1>
      <p>餡咲市の写真を投稿できます。</p>
    </header>


    <!-- ログアウト状態 -->
    <section id="logged-out-view" class="card">

      <h2>ログイン</h2>

      <p>
        写真を投稿するにはDiscordでログインしてください。
      </p>

      <button id="login-btn" class="discord-button">
        Discordでログイン
      </button>

    </section>


    <!-- ログイン状態 -->
    <section id="logged-in-view" class="hidden">

      <div class="user-card">

        <div>
          <span class="user-label">ログイン中</span>
          <strong id="user-display-name"></strong>
        </div>

        <button id="logout-btn" class="logout-button">
          ログアウト
        </button>

      </div>


      <!-- 投稿フォーム -->
      <section class="card">

        <h2>写真を投稿</h2>

        <form id="upload-form">

          <div class="form-group">

            <label for="photo-file">
              写真
            </label>

            <input
              type="file"
              id="photo-file"
              accept="image/jpeg,image/png,image/webp"
              required
            >

            <p class="help-text">
              JPEG・PNG・WebP / 最大10MB
            </p>

          </div>


          <!-- 画像プレビュー -->
          <div id="image-preview" class="preview hidden">

            <img
              id="image-preview-img"
              src=""
              alt="写真プレビュー"
            >

          </div>


          <div class="form-group">

            <label for="photo-title">
              写真タイトル
            </label>

            <input
              type="text"
              id="photo-title"
              maxlength="100"
              placeholder="例：餡咲駅を走る列車"
              required
            >

          </div>


          <button
            type="submit"
            id="submit-btn"
            class="submit-button"
          >
            投稿する
          </button>

        </form>


        <div id="message" class="message"></div>

      </section>

    </section>

  </main>


  <script type="module" src="app.js"></script>

</body>
</html>
